    <main class="flex-1 w-full p-4 flex flex-col items-center justify-center lg:p-0 lg:grid lg:grid-cols-2 lg:items-stretch">
        
        <!-- CỘT TRÁI: ma trận (trên điện thoại các khối xếp dọc theo thứ tự order) -->
        <div class="contents lg:flex lg:flex-col lg:items-center lg:justify-center lg:w-full lg:p-8 lg:bg-black/25 lg:border-r-2 lg:border-amber-500/30">
            <!-- MA TRẬN Ô (chỉ xem, đồng bộ từ trang Trò chơi) -->
            <section id="board-section" class="order-2 w-full max-w-2xl mb-5 lg:mb-0 lg:max-w-none p-3 md:p-4 rounded-2xl glass-panel border border-amber-500/40 shadow-2xl">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                    <span class="text-[11px] uppercase tracking-widest text-amber-400 font-bold">
                        <i class="fa-solid fa-table-cells-large mr-1"></i> Ma Trận Tri Thức
                    </span>
                    <span class="flex items-center gap-3 text-[10px] font-bold text-gray-300 uppercase tracking-wider">
                        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bg-amber-400/70 inline-block"></span> Còn</span>
                        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bg-emerald-500 inline-block"></span> Đúng</span>
                        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bg-gray-500 inline-block"></span> Khóa</span>
                    </span>
                </div>
                <div id="board-grid" class="grid gap-1.5 md:gap-2.5"></div>
            </section>
        </div>

        <!-- CỘT PHẢI: trạng thái, câu hỏi, chuông -->
        <div class="contents lg:flex lg:flex-col lg:items-center lg:justify-center lg:w-full lg:p-8">
        <div id="status-banner" class="order-1 w-full max-w-xl mb-4 p-4 rounded-2xl glass-panel border border-amber-500/40 text-center shadow-2xl">
            <div class="text-[11px] uppercase tracking-widest text-amber-400 font-bold mb-1">
                <i class="fa-solid fa-signal text-amber-400 animate-pulse"></i> ĐỒNG BỘ TRỰC TIẾP TỪ MC
            </div>
            <h2 id="status-title" class="font-display text-xl md:text-2xl font-black text-white uppercase">ĐANG CHỜ MỞ CHUÔNG</h2>
            <p id="status-subtitle" class="text-xs text-gray-300 mt-1">Vui lòng chú ý tín hiệu mở chuông từ MC</p>
        </div>

        <!-- Khung hiển thị CÂU HỎI từ MC -->
        <div id="question-card" class="order-3 w-full max-w-xl mb-6 p-5 rounded-2xl glass-panel border-2 border-amber-500/50 shadow-2xl transition-all duration-300 hidden">
            <div class="flex items-center justify-between border-b border-amber-500/30 pb-3 mb-3">
                <span id="question-number" class="text-xs font-black text-amber-400 uppercase tracking-wider bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/30">
                    <i class="fa-solid fa-circle-question mr-1"></i> CÂU HỎI
                </span>
                <span id="question-points" class="text-xs font-bold text-amber-300 bg-black/40 px-2.5 py-1 rounded-lg border border-amber-500/20">
                    10 Điểm
                </span>
            </div>
            
            <h3 id="question-text" class="text-lg md:text-xl font-bold text-white text-center leading-relaxed mb-4">
                Đang tải câu hỏi...
            </h3>

            <!-- Các phương án lựa chọn A, B, C, D (nếu có) -->
            <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-2.5 pt-2 hidden">
                <div id="opt-a" class="p-3 rounded-xl bg-black/50 border border-amber-500/20 text-xs md:text-sm font-medium text-amber-100 flex items-center">
                    <span class="w-6 h-6 rounded-lg bg-amber-500/20 text-amber-300 font-black flex items-center justify-center mr-2 shrink-0">A</span>
                    <span class="opt-text">--</span>
                </div>
                <div id="opt-b" class="p-3 rounded-xl bg-black/50 border border-amber-500/20 text-xs md:text-sm font-medium text-amber-100 flex items-center">
                    <span class="w-6 h-6 rounded-lg bg-amber-500/20 text-amber-300 font-black flex items-center justify-center mr-2 shrink-0">B</span>
                    <span class="opt-text">--</span>
                </div>
                <div id="opt-c" class="p-3 rounded-xl bg-black/50 border border-amber-500/20 text-xs md:text-sm font-medium text-amber-100 flex items-center">
                    <span class="w-6 h-6 rounded-lg bg-amber-500/20 text-amber-300 font-black flex items-center justify-center mr-2 shrink-0">C</span>
                    <span class="opt-text">--</span>
                </div>
                <div id="opt-d" class="p-3 rounded-xl bg-black/50 border border-amber-500/20 text-xs md:text-sm font-medium text-amber-100 flex items-center">
                    <span class="w-6 h-6 rounded-lg bg-amber-500/20 text-amber-300 font-black flex items-center justify-center mr-2 shrink-0">D</span>
                    <span class="opt-text">--</span>
                </div>
            </div>
        </div>

        <div class="order-4 relative flex items-center justify-center my-2">
            <button id="main-buzzer-btn" onclick="pressBuzzer()" class="buzzer-btn buzzer-btn-waiting w-60 h-60 md:w-72 md:h-72 flex flex-col items-center justify-center relative shadow-2xl">
                <div id="buzzer-icon-container" class="mb-2 text-gray-400 text-5xl md:text-6xl">
                    <i class="fa-solid fa-bell" id="buzzer-icon"></i>
                </div>
                <span id="buzzer-text" class="font-display font-black text-xl md:text-3xl tracking-widest text-gray-300 uppercase">CHỜ LỆNH</span>
                <span id="buzzer-subtext" class="text-[10px] md:text-xs text-gray-400 font-bold mt-1 tracking-wider uppercase">CHƯA MỞ CHUÔNG</span>
            </button>
        </div>

        <div class="order-5 mt-4 flex items-center gap-3 px-5 py-2.5 rounded-2xl glass-panel border border-amber-500/30">
            <div id="active-team-avatar" class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-black text-xs" style="background-color: #FFD700;">V</div>
            <div>
                <span class="text-[10px] text-gray-400 uppercase tracking-widest font-bold block">Đội Của Bạn</span>
                <span id="active-team-name" class="font-display font-bold text-sm text-amber-200">Đội Vàng Hoàng Gia</span>
            </div>
        </div>
        </div>
    </main>

    <script>
        const TEAMS = [
            { id: 1, name: 'Đội Vàng Hoàng Gia', color: '#FFD700' },
            { id: 2, name: 'Đội Sư Tử Trẻ', color: '#F39C12' },
            { id: 3, name: 'Đội Chinh Phục', color: '#EF4444' },
            { id: 4, name: 'Đội Bản Lĩnh', color: '#3B82F6' }
        ];

        const channel = window.BroadcastChannel ? new BroadcastChannel('CHINH_PHUC_BUZZER_CHANNEL') : null;
        let state = { winnerTeamId: null, activeTeamId: 1, buzzerStatus: 'WAITING', soundEnabled: true, currentQuestion: null, board: null, activeCode: null };
        const BOARD_KEY = 'CHINH_PHUC_BOARD_STATE';

        function playBuzzerSound() {
            if (!state.soundEnabled) return;
            const el = document.getElementById('audio-buzzer');
            if (el) {
                el.currentTime = 0;
                el.play().catch(() => {});
            }
        }

        function toggleSound() {
            state.soundEnabled = !state.soundEnabled;
            document.getElementById('sound-icon').className = state.soundEnabled ? "fa-solid fa-volume-high" : "fa-solid fa-volume-xmark";
        }

        window.addEventListener('DOMContentLoaded', () => {
            syncUI();
            loadBoardFromStorage();
            requestBoard();
            if (channel) channel.onmessage = (e) => handleMessage(e.data);
            window.addEventListener('storage', (e) => {
                if (e.key === BOARD_KEY && e.newValue) {
                    try { handleMessage(JSON.parse(e.newValue)); } catch(err){}
                } else if (e.key === 'CHINH_PHUC_BUZZER_EVENT' && e.newValue) {
                    try { handleMessage(JSON.parse(e.newValue)); } catch(err){}
                }
            });
        });

        function changeActiveTeam(id) {
            state.activeTeamId = parseInt(id);
            const t = TEAMS.find(x => x.id === state.activeTeamId);
            if (t) {
                document.getElementById('active-team-name').innerText = t.name;
                document.getElementById('active-team-avatar').style.backgroundColor = t.color;
                document.getElementById('active-team-avatar').innerText = t.name.charAt(0);
            }
        }

        function handleMessage(data) {
            if (!data) return;

            if (data.type === 'BOARD_STATE') {
                state.board = data;
                renderBoard();
            } else if (data.type === 'SHOW_QUESTION') {
                displayQuestion(data.question);
            } else if (data.type === 'HIDE_QUESTION') {
                hideQuestion();
            } else if (data.type === 'HOST_OPEN_BUZZER') {
                state.buzzerStatus = 'OPEN';
                syncUI();
            } else if (data.type === 'BUZZER_PRESSED') {
                state.winnerTeamId = data.teamId;
                state.buzzerStatus = 'ANSWERING';
                syncUI();
            } else if (data.type === 'HOST_RESET_ALL' || data.type === 'HOST_CORRECT_ANSWER') {
                state.buzzerStatus = 'WAITING';
                syncUI();
            }
        }

        function displayQuestion(q) {
            if (!q) return;
            state.currentQuestion = q;
            state.activeCode = q.id || null;
            renderBoard();
            const qCard = document.getElementById('question-card');
            document.getElementById('question-number').innerHTML = `<i class="fa-solid fa-circle-question mr-1"></i> CÂU ${q.id || ''}`;
            document.getElementById('question-points').innerText = `${q.points || 10} Điểm`;
            document.getElementById('question-text').innerText = q.text || q.title || '';

            const optsContainer = document.getElementById('options-container');
            if (q.options && typeof q.options === 'object') {
                optsContainer.classList.remove('hidden');
                ['a', 'b', 'c', 'd'].forEach(optKey => {
                    const el = document.getElementById(`opt-${optKey}`);
                    if (q.options[optKey]) {
                        el.classList.remove('hidden');
                        el.querySelector('.opt-text').innerText = q.options[optKey];
                    } else {
                        el.classList.add('hidden');
                    }
                });
            } else {
                optsContainer.classList.add('hidden');
            }

            qCard.classList.remove('hidden');
        }

        function hideQuestion() {
            state.currentQuestion = null;
            state.activeCode = null;
            renderBoard();
            document.getElementById('question-card').classList.add('hidden');
        }

        // ----- MA TRẬN Ô: chỉ hiển thị, không bấm được -----
        function escHtml(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function loadBoardFromStorage() {
            try {
                const raw = localStorage.getItem(BOARD_KEY);
                if (raw) { state.board = JSON.parse(raw); }
            } catch (err) {}
            renderBoard();
        }

        function requestBoard() {
            const msg = { type: 'REQUEST_BOARD', timestamp: Date.now() };
            if (channel) channel.postMessage(msg);
            try { localStorage.setItem('CHINH_PHUC_BUZZER_EVENT', JSON.stringify(msg)); } catch (err) {}
        }

        function renderBoard() {
            const grid = document.getElementById('board-grid');
            if (!grid) return;
            const b = state.board;
            if (!b || !Array.isArray(b.cells) || !b.cells.length) {
                grid.style.gridTemplateColumns = '1fr';
                grid.innerHTML = '<div class="text-center text-xs text-gray-400 py-6"><i class="fa-solid fa-hourglass-half text-amber-400 mr-1"></i> Đang chờ MC khởi tạo ma trận...</div>';
                return;
            }
            const size = b.size || Math.round(Math.sqrt(b.cells.length));
            grid.style.gridTemplateColumns = `repeat(${size}, minmax(0, 1fr))`;
            const compact = size >= 6;
            let html = '';
            b.cells.forEach(cell => {
                let bgStyle = 'from-amber-500/20 via-orange-500/10 to-yellow-600/20 border-amber-500/40 text-amber-300';
                let badge = '';
                if (cell.status === 'correct') {
                    bgStyle = 'bg-emerald-950/90 border-emerald-500 text-emerald-400';
                    badge = '<div class="absolute top-1 right-1.5 text-emerald-400 text-[10px] md:text-xs font-black"><i class="fa-solid fa-circle-check"></i></div>';
                } else if (cell.status === 'incorrect') {
                    bgStyle = 'cell-grayed-out';
                    badge = '<div class="absolute top-1 right-1.5 text-gray-400 text-[10px] md:text-xs font-bold"><i class="fa-solid fa-lock"></i></div>';
                }
                const isActive = state.activeCode && cell.code === state.activeCode;
                const activeCls = isActive ? 'animate-pulse scale-105 z-10' : '';
                const activeStyle = isActive ? 'border-color:#FFD700;box-shadow:0 0 22px rgba(255,215,0,0.85);' : '';
                html += `
                    <div class="relative rounded-xl md:rounded-2xl border bg-gradient-to-br ${bgStyle} ${activeCls} cursor-default pointer-events-none flex flex-col items-center justify-center gap-0.5 md:gap-1 shadow-lg ${compact ? 'p-1.5 min-h-[62px] md:p-3 md:min-h-[86px] lg:min-h-[96px] xl:min-h-[110px]' : 'p-2 min-h-[72px] md:p-4 md:min-h-[100px] lg:min-h-[120px] xl:min-h-[150px]'}" style="${activeStyle}">
                        ${badge}
                        <span class="font-display font-black tracking-wide ${compact ? 'text-base md:text-2xl' : 'text-lg md:text-2xl'}">${escHtml(cell.code)}</span>
                        <span class="font-bold px-1.5 py-0.5 rounded-full bg-black/50 border border-white/10 truncate max-w-full text-[9px] md:text-[11px]">${escHtml(cell.field)}</span>
                        <span class="font-black text-amber-400 text-[9px] md:text-xs">${escHtml(cell.points)} ĐIỂM</span>
                    </div>`;
            });
            grid.innerHTML = html;
        }

        function pressBuzzer() {
            if (state.buzzerStatus !== 'OPEN') return;
            playBuzzerSound();
            const t = TEAMS.find(x => x.id === state.activeTeamId);
            state.winnerTeamId = t.id; const msg = { type: 'BUZZER_PRESSED', teamId: t.id, teamName: t.name, timestamp: Date.now() };
            if (channel) channel.postMessage(msg);
            localStorage.setItem('CHINH_PHUC_BUZZER_EVENT', JSON.stringify(msg));
            
            state.buzzerStatus = 'ANSWERING';
            syncUI();
        }

        function syncUI() {
            const btn = document.getElementById('main-buzzer-btn');
            const title = document.getElementById('status-title');
            const sub = document.getElementById('status-subtitle');
            const icon = document.getElementById('buzzer-icon');
            const text = document.getElementById('buzzer-text');

            if (state.buzzerStatus === 'OPEN') {
                btn.className = "buzzer-btn buzzer-btn-open w-60 h-60 md:w-72 md:h-72 flex flex-col items-center justify-center relative shadow-2xl animate-pulse";
                icon.className = "fa-solid fa-bell text-black";
                text.innerText = "BẤM CHUÔNG!";
                title.innerText = "MỜI BẤM CHUÔNG!";
                sub.innerText = "Nhanh tay giành quyền trả lời!";
            } else if (state.buzzerStatus === 'ANSWERING') {
                btn.className = "buzzer-btn buzzer-btn-winner w-60 h-60 md:w-72 md:h-72 flex flex-col items-center justify-center relative shadow-2xl";
                icon.className = "fa-solid fa-microphone-lines text-white";
                text.innerText = state.winnerTeamId == state.activeTeamId ? "ĐÃ NHẬN!" : "ĐỘI KHÁC ĐÃ BẤM";
                title.innerText = "ĐÃ CÓ ĐỘI BẤM CHUÔNG!";
                sub.innerText = "Đang trả lời câu hỏi...";
            } else {
                btn.className = "buzzer-btn buzzer-btn-waiting w-60 h-60 md:w-72 md:h-72 flex flex-col items-center justify-center relative shadow-2xl";
                icon.className = "fa-solid fa-hourglass-half text-gray-400";
                text.innerText = "CHỜ LỆNH";
                title.innerText = "ĐANG CHỜ MỞ CHUÔNG";
                sub.innerText = "Vui lòng chú ý tín hiệu từ MC";
            }
        }
    </script>
</body>
</html>
